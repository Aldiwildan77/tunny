name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.3.4-rc-2
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Use current release configuration for manual tags
        if: ${{ inputs.tag != '' }}
        shell: pwsh
        run: |
          $config = git show origin/master:.goreleaser.yaml
          [System.IO.File]::WriteAllText((Join-Path $PWD '.goreleaser.yaml'), $config)

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

      - name: Publish Chocolatey package
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $package = Get-ChildItem -Path dist -Filter '*.nupkg' | Select-Object -First 1
          if (-not $package) {
            Write-Warning 'No Chocolatey package was generated.'
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            Write-Warning 'CHOCOLATEY_API_KEY is not configured; skipping Chocolatey publish.'
            exit 0
          }

          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
