route-map ACCEPT-ALL permit 10

route-map PREFER-ID2 permit 10
    set local-preference 200

frr defaults traditional

hostname id-west-3

router bgp 65003
    bgp router-id 10.0.0.13

    # ! for ECMP
    maximum-paths 2
    bgp bestpath as-path multipath-relax

    neighbor 10.0.0.11 remote-as 65001
    neighbor 10.0.0.12 remote-as 65002

    address-family ipv4 unicast
        network 10.3.0.0/24

        neighbor 10.0.0.11 activate
        neighbor 10.0.0.11 route-map ACCEPT-ALL in
        neighbor 10.0.0.11 route-map ACCEPT-ALL out

        neighbor 10.0.0.12 activate
        # ! for LOCAL-PREFERENCE
        # neighbor 10.0.0.12 route-map PREFER-ID2 in
        neighbor 10.0.0.12 route-map ACCEPT-ALL in
        neighbor 10.0.0.12 route-map ACCEPT-ALL out
    exit-address-family

ip route 10.3.0.0/24 Null0
