<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Tunny</title>
  <style>
    :root { --ink: #000; --muted: #444; --paper: #fff; --panel: #fff; --line: #c8c8c8; --blue: #0645ad; --blue-dark: #001b44; --max: 900px; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 17px/1.65 Arial, Helvetica, sans-serif; }
    a { color: var(--blue); }
    a:hover { color: var(--blue-dark); }
    .topbar { border-bottom: 1px solid var(--line); background: #fff; }
    .nav, main, footer { width: min(var(--max), calc(100% - 40px)); margin: 0 auto; }
    .nav { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { color: var(--ink); font: 700 1rem/1 Arial, Helvetica, sans-serif; text-decoration: none; }
    nav { display: flex; gap: 14px; flex-wrap: wrap; }
    nav a { font: 400 .82rem/1 Arial, Helvetica, sans-serif; text-decoration: none; }
    main { padding: 64px 0 80px; }
    .eyebrow { color: var(--blue); font: 700 .75rem/1.2 Arial, Helvetica, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3 { font-family: Arial, Helvetica, sans-serif; line-height: 1.2; }
    h1 { margin: 12px 0 28px; font-size: clamp(2rem, 5vw, 3.6rem); }
    h2 { margin-top: 42px; padding-top: 18px; border-top: 2px solid var(--blue); font-size: 1.65rem; }
    h3 { font-size: 1.15rem; }
    code { padding: .12em .3em; background: #f0f0f0; font-size: .88em; }
    pre { overflow: auto; padding: 20px; border-left: 4px solid var(--blue); color: #fff; background: #111; }
    pre code { padding: 0; color: inherit; background: transparent; }
    table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { padding: 9px 12px; border: 1px solid var(--line); text-align: left; }
    th { background: #f0f0f0; font-family: Arial, Helvetica, sans-serif; }
    blockquote { margin: 20px 0; padding: 4px 20px; border-left: 4px solid var(--blue); color: var(--muted); }
    footer { padding: 24px 0 44px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    @media (max-width: 680px) { .nav { align-items: flex-start; padding: 16px 0; flex-direction: column; } main { padding-top: 42px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav">
      <a class="brand" href="{{ '/' | relative_url }}">tunny</a>
      <nav aria-label="Documentation navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/serve.html' | relative_url }}">Serve</a>
        <a href="{{ '/routing.html' | relative_url }}">Routing</a>
        <a href="{{ '/providers.html' | relative_url }}">Providers</a>
        <a href="https://github.com/Aldiwildan77/tunny">GitHub</a>
      </nav>
    </div>
  </header>
  <main>
    <p class="eyebrow">Tunny documentation</p>
    {{ content }}
  </main>
  <footer>
    Tunny v0.4.0 · <a href="{{ '/' | relative_url }}">Project home</a> · <a href="https://github.com/Aldiwildan77/tunny">Source repository</a>
  </footer>
</body>
</html>
