version: 2

before:
  hooks:
    - go mod tidy
    - cp .example.config.yaml config.yaml

builds:
  - main: ./cmd/tunny
    binary: tunny

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz

    name_template: >-
      {{ .ProjectName }}_
      {{ .Version }}_
      {{ .Os }}_
      {{ .Arch }}

    files:
      - config.yaml

    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
